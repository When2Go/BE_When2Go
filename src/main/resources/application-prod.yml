spring:
  application:
    name: when2go
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PWD}

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    hibernate:
      ddl-auto: update
      use_sql_comments: true
      jdbc:
        batch_size: 500

  data:
    redis:
      host: when2go-redis
      port: 6379

  task:
    scheduling:
      pool:
        size: 4   # 알림 스캔 / outbox 복구 / 경로 재계산이 서로 막지 않도록

notification:
  fcm:
    enabled: ${NOTIFICATION_FCM_ENABLED:true}
    credentials-path: ${FCM_CREDENTIALS_PATH:}
    credentials-base64: ${FCM_CREDENTIALS_BASE64:}
  scheduler:
    enabled: ${NOTIFICATION_SCHEDULER_ENABLED:true}
  sqs:
    enabled: ${NOTIFICATION_SQS_ENABLED:false}
    region: ap-northeast-2
    queue-url: ${NOTIFICATION_SQS_QUEUE_URL:}
