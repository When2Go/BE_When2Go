services:
  app:
    image: ${APP_IMAGE:-when2go-app:local}
    build: .
    container_name: when2go-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: ${TZ:-Asia/Seoul}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=Asia/Seoul}
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PWD: ${DB_PWD:-}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      TRIP_RECALC_ENABLED: ${TRIP_RECALC_ENABLED:-true}
      NOTIFICATION_FCM_ENABLED: ${NOTIFICATION_FCM_ENABLED:-false}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      FCM_CREDENTIALS_BASE64: ${FCM_CREDENTIALS_BASE64:-}
      NOTIFICATION_SCHEDULER_ENABLED: ${NOTIFICATION_SCHEDULER_ENABLED:-true}
      NOTIFICATION_SQS_ENABLED: ${NOTIFICATION_SQS_ENABLED:-false}
      NOTIFICATION_SQS_QUEUE_URL: ${NOTIFICATION_SQS_QUEUE_URL:-}
    depends_on:
      when2go-redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      wiremock:
        condition: service_started
    networks:
      - when2go-net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: when2go-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: when2go
      MYSQL_USER: when2go
      MYSQL_PASSWORD: when2go
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    networks: [ when2go-net ]

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: when2go-wiremock
    command: ["--port", "8080", "--verbose"]
    volumes: [ "./docker/wiremock/mappings:/home/wiremock/mappings:ro" ]
    networks: [ when2go-net ]

  k6:
    image: grafana/k6:0.53.0
    container_name: when2go-k6
    profiles: [ "loadtest" ]
    volumes: [ "./docker/k6:/scripts:ro" ]
    environment: { BASE_URL: "http://app:8080" }
    networks: [ when2go-net ]

  when2go-redis:
    image: redis:7-alpine
    container_name: when2go-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - when2go-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: when2go-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      GF_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/infrastructure.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - when2go-net
    restart: unless-stopped

networks:
  when2go-net:
    driver: bridge

volumes:
  redis-data:
  grafana-data:
