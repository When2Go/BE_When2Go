name: Deploy to EC2 via ECR

on:
  push:
    branches:
      - main
      - release
      - test
    paths-ignore:
      - README.md
      - docs/**

  workflow_dispatch:

env:
  IMAGE_TAG: latest
  NOTIFICATION_LAMBDA_NAME: when2go-notification-sender

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          SHA_TAG: ${{ github.sha }}
        run: |
          set -e

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build notification Lambda
        run: ./gradlew :notification-lambda:buildZip --no-daemon

      - name: Deploy notification Lambda
        env:
          FCM_CREDENTIALS_JSON: ${{ secrets.FCM_CREDENTIALS_JSON }}
          FCM_CREDENTIALS_BASE64: ${{ secrets.FCM_CREDENTIALS_BASE64 }}
        run: |
          set -e

          if [ -z "$FCM_CREDENTIALS_JSON" ] && [ -z "$FCM_CREDENTIALS_BASE64" ]; then
            echo "FCM_CREDENTIALS_JSON or FCM_CREDENTIALS_BASE64 secret is required for notification Lambda"
            exit 1
          fi

          aws lambda update-function-code \
            --function-name "$NOTIFICATION_LAMBDA_NAME" \
            --zip-file fileb://notification-lambda/build/distributions/notification-lambda.zip \
            > /dev/null
          aws lambda wait function-updated --function-name "$NOTIFICATION_LAMBDA_NAME"

          jq -n --arg json "$FCM_CREDENTIALS_JSON" --arg b64 "$FCM_CREDENTIALS_BASE64" \
            '{Variables: {FCM_CREDENTIALS_JSON: $json, FCM_CREDENTIALS_BASE64: $b64}}' > lambda-env.json
          aws lambda update-function-configuration \
            --function-name "$NOTIFICATION_LAMBDA_NAME" \
            --environment file://lambda-env.json \
            > /dev/null
          rm -f lambda-env.json
          aws lambda wait function-updated --function-name "$NOTIFICATION_LAMBDA_NAME"

      - name: Copy docker-compose.yml to API EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_API_HOST }}
          username: ${{ secrets.EC2_API_USER }}
          key: ${{ secrets.EC2_API_SSH_KEY }}
          source: docker-compose.yml,grafana
          target: /home/${{ secrets.EC2_API_USER }}/when2go

      - name: Deploy to API EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_API_HOST }}
          username: ${{ secrets.EC2_API_USER }}
          key: ${{ secrets.EC2_API_SSH_KEY }}
          script: |
            set -e

            cd /home/${{ secrets.EC2_API_USER }}/when2go

            export AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY }}'
            export AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_KEY }}'
            export AWS_DEFAULT_REGION='${{ secrets.AWS_REGION }}'

            cat > .env <<'EOF'
            APP_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PWD=${{ secrets.DB_PWD }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            GOOGLE_ROUTES_API_KEY=${{ secrets.GOOGLE_ROUTES_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            TZ=Asia/Seoul
            JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
            TRIP_RECALC_ENABLED=false
            NOTIFICATION_SCHEDULER_ENABLED=false
            NOTIFICATION_FCM_ENABLED=false
            EOF

            chmod 600 .env

            aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
              | docker login --username AWS --password-stdin "${{ steps.login-ecr.outputs.registry }}"

            docker compose pull app
            docker compose up -d --no-deps --remove-orphans app when2go-redis grafana
            docker image prune -f

      - name: Copy docker-compose.yml to Scheduler EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_SCHEDULER_HOST }}
          username: ${{ secrets.EC2_SCHEDULER_USER }}
          key: ${{ secrets.EC2_SCHEDULER_SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.EC2_SCHEDULER_USER }}/when2go

      - name: Deploy to Scheduler EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SCHEDULER_HOST }}
          username: ${{ secrets.EC2_SCHEDULER_USER }}
          key: ${{ secrets.EC2_SCHEDULER_SSH_KEY }}
          script: |
            set -e

            cd /home/${{ secrets.EC2_SCHEDULER_USER }}/when2go

            cat > .env <<'EOF'
            APP_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PWD=${{ secrets.DB_PWD }}
            GOOGLE_ROUTES_API_KEY=${{ secrets.GOOGLE_ROUTES_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            TZ=Asia/Seoul
            JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
            TRIP_RECALC_ENABLED=true
            NOTIFICATION_SCHEDULER_ENABLED=true
            NOTIFICATION_SQS_ENABLED=true
            NOTIFICATION_SQS_QUEUE_URL=${{ secrets.NOTIFICATION_SQS_QUEUE_URL }}
            NOTIFICATION_FCM_ENABLED=false
            EOF

            # FCM 발송은 Lambda로 옮겨서 스케줄러에는 FCM 키가 필요 없음
            rm -rf .secrets

            chmod 600 .env

            # ECR 로그인과 SQS 접근은 EC2 IAM role로
            aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
              | docker login --username AWS --password-stdin "${{ steps.login-ecr.outputs.registry }}"

            docker compose pull app
            docker compose up -d --no-deps --remove-orphans app when2go-redis
            docker image prune -f
